[project]
name = "llmkit"
version = "0.1.0"
description = "Shared measurement, memory-model and engine-simulation core for the LLM inference stack"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "numpy>=1.24"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmkit*"]
